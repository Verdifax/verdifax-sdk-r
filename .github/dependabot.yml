# Keeps the pinned GitHub Actions SHAs current, with the matching version
# comment kept in sync. Dependabot has no R package ecosystem; the R
# dependencies are declared with minimum versions in DESCRIPTION.
#
# Every ecosystem is checked monthly, and its minor and patch updates
# come as one grouped pull request once each release is at least 14
# days old. Major versions are not proposed as version updates: they
# change behavior and are migrated deliberately. These settings do not
# delay security updates, and Verdifax's review replay fails on any
# open Dependabot alert and on any Dependabot pull request open for
# more than 14 days.
#
# .github/workflows/dependabot-merge.yml merges a grouped pull request
# once its CI run passes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
