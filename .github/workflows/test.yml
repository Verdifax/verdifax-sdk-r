name: test

# Runs the testthat suite (pure-function environment-capture and client
# tests; no network access required) on every push and PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        run: Rscript -e 'install.packages(c("httr2", "jsonlite", "testthat"))'

      - name: Install package
        run: R CMD INSTALL .

      - name: Run tests
        run: Rscript -e 'library(testthat); library(verdifax); test_dir("tests/testthat", stop_on_failure = TRUE)'
