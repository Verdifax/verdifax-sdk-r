name: test

# Runs the testthat suite (pure-function environment-capture and client
# tests; no network access required) on every push and PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # Ubuntu 24.04 because the package snapshot below is built for it.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: "4.6.1"

      - name: Install dependencies
        # A dated Posit Package Manager snapshot fixes every package at its
        # version on that day, so CI cannot pick up a newer one.
        run: Rscript -e 'options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/2026-10-25")); install.packages(c("httr2", "jsonlite", "testthat"))'

      - name: Install package
        run: R CMD INSTALL .

      - name: Run tests
        run: Rscript -e 'library(testthat); library(verdifax); test_dir("tests/testthat", stop_on_failure = TRUE)'
